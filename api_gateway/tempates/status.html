<!-- templates/status.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services Status - API Gateway</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
        }
        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .service-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .service-card.healthy {
            border-left: 5px solid #28a745;
        }
        .service-card.unhealthy {
            border-left: 5px solid #ffc107;
        }
        .service-card.down {
            border-left: 5px solid #dc3545;
        }
        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .service-name {
            font-weight: bold;
            font-size: 1.2em;
        }
        .service-status {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9em;
        }
        .status-healthy {
            background: #d4edda;
            color: #155724;
        }
        .status-unhealthy {
            background: #fff3cd;
            color: #856404;
        }
        .status-down {
            background: #f8d7da;
            color: #721c24;
        }
        .service-url {
            font-size: 0.9em;
            color: #666;
            word-break: break-all;
            margin: 10px 0;
        }
        .refresh-btn {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        .refresh-btn:hover {
            background: #0056b3;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
        }
        .timestamp {
            color: #666;
            font-size: 0.9em;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Services Status Monitor</h1>
        <p class="timestamp">Last checked: {{ timestamp }}</p>

        <button class="refresh-btn" onclick="location.reload()">🔄 Refresh Status</button>

        <div class="service-grid">
            {% for name, info in services.items() %}
            <div class="service-card {{ info.status }}">
                <div class="service-header">
                    <div class="service-name">{{ name }}</div>
                    <div class="service-status status-{{ info.status }}">
                        {{ info.status }}
                    </div>
                </div>
                <div class="service-url">{{ info.url }}</div>
                <div>Health endpoint: {{ info.health_endpoint }}</div>
            </div>
            {% endfor %}
        </div>

        <a href="/" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
